<div class="form-card form-card--narrow">
  <h1>Regisztráció</h1>

  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-grid">
      <div class="form-field">
        <label for="username">Felhasználónév</label>
        <input id="username" formControlName="username" placeholder="Felhasználónév" />
      </div>
      <div class="form-field">
        <label for="email">Email</label>
        <input id="email" formControlName="email" placeholder="Email" />
      </div>
      <div class="form-field">
        <label for="password">Jelszó</label>
        <input id="password" type="password" formControlName="password" placeholder="Jelszó" />
      </div>
    </div>

    @if (errorMessage()) {
      <p class="error-message">{{ errorMessage() }}</p>
    }

    <div class="form-actions">
      <button type="submit" [disabled]="form.invalid">Regisztráció</button>
    </div>
  </form>
</div>
